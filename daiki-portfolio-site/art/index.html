<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sketches — Daiki Takahashi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A192F;
    --foam:#F4F7F9;
    --foam-dim:#e7edf0;
    --teal:#00A8B5;
    --lime:#D4E94C;
    --ink:#0F172A;
    --ink-soft:#4b5768;
    --line:#d7e0e4;
    --font-display:'Syne', 'Arial Black', sans-serif;
    --font-body:'Inter', 'Helvetica Neue', Arial, sans-serif;
    --font-mono:'JetBrains Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--foam);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
  @media (max-width:640px){.wrap{padding:0 20px;}}

  header{padding:28px 0 8px;}
  .back-link{
    font-family:var(--font-mono);font-size:0.75rem;letter-spacing:0.04em;
    color:var(--ink-soft);opacity:0.75;transition:opacity .2s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .back-link:hover{opacity:1;color:var(--teal);}

  .page-intro{padding:36px 0 8px;}
  .page-intro h1{
    font-family:var(--font-display);font-weight:800;letter-spacing:-0.02em;
    font-size:clamp(1.8rem,4vw,2.6rem);text-transform:uppercase;margin:0 0 8px;
  }
  .page-intro p{
    font-family:var(--font-mono);font-size:0.82rem;color:var(--ink-soft);
    max-width:520px;margin:0;
  }

  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:18px;
    padding:36px 0 80px;
  }
  .art-thumb{
    background:none;border:none;padding:0;cursor:pointer;text-align:left;
    font:inherit;color:inherit;
    border-radius:10px;overflow:hidden;
    transition:transform .2s;
  }
  .art-thumb:hover{transform:translateY(-2px);}
  .art-thumb:focus-visible{outline:2px solid var(--teal);outline-offset:3px;}
  .art-thumb .thumb-frame{
    aspect-ratio:1/1;overflow:hidden;border-radius:10px;
    border:1px solid var(--line);background:#fff;
  }
  .art-thumb img{width:100%;height:100%;object-fit:cover;}
  .art-cap{
    display:block;margin-top:8px;
    font-family:var(--font-mono);font-size:0.72rem;color:var(--ink-soft);
    letter-spacing:0.01em;
  }

  .gallery-empty{
    font-family:var(--font-mono);font-size:0.8rem;color:var(--ink-soft);
    padding:40px 0;
  }

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:200;
    background:rgba(10,25,47,0.92);
    display:flex;align-items:center;justify-content:center;
    padding:40px 20px;
    opacity:0;pointer-events:none;
    transition:opacity .2s;
  }
  .lightbox.open{opacity:1;pointer-events:auto;}
  .lightbox-inner{max-width:min(920px,92vw);max-height:88vh;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .lightbox-inner img{max-width:100%;max-height:76vh;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
  .lightbox-cap{font-family:var(--font-mono);font-size:0.8rem;color:var(--foam);opacity:0.85;}
  .lightbox-close{
    position:absolute;top:20px;right:24px;
    font-family:var(--font-mono);font-size:0.85rem;color:var(--foam);
    background:rgba(244,247,249,0.1);border:1px solid rgba(244,247,249,0.25);
    border-radius:999px;padding:8px 14px;cursor:pointer;
  }
  .lightbox-close:hover{background:rgba(244,247,249,0.2);}
  .lightbox-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    font-family:var(--font-mono);font-size:1.1rem;color:var(--foam);
    background:rgba(244,247,249,0.1);border:1px solid rgba(244,247,249,0.25);
    border-radius:999px;width:42px;height:42px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .lightbox-nav:hover{background:rgba(244,247,249,0.2);}
  .lightbox-prev{left:16px;}
  .lightbox-next{right:16px;}
  @media (max-width:600px){.lightbox-nav{width:36px;height:36px;font-size:0.95rem;}}
</style>
</head>
<body>

  <header class="wrap">
    <a class="back-link" href="../index.html">&larr; daiki takahashi</a>
  </header>

  <div class="wrap page-intro">
    <h1>Sketches</h1>
    <p>Colored pencil drawings and a little digital art, off duty from the code. Uploaded here as I go.</p>
  </div>

  <div class="wrap">
    <div id="gallery" class="gallery" aria-live="polite"></div>
  </div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged drawing">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">Close ✕</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous drawing">&larr;</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next drawing">&rarr;</button>
    <div class="lightbox-inner">
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-cap" id="lightbox-cap"></div>
    </div>
  </div>

<script>
  var items = [];
  var currentIndex = -1;

  var gallery = document.getElementById('gallery');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');
  var lightboxCap = document.getElementById('lightbox-cap');

  function renderGallery(){
    gallery.innerHTML = '';
    items.forEach(function(item, idx){
      var btn = document.createElement('button');
      btn.className = 'art-thumb';
      btn.setAttribute('aria-label', 'Open: ' + item.caption);
      btn.innerHTML =
        '<span class="thumb-frame"><img loading="lazy" src="images/' + item.file + '" alt="' + item.caption + '"></span>' +
        '<span class="art-cap">' + item.caption + '</span>';
      btn.addEventListener('click', function(){ openLightbox(idx); });
      gallery.appendChild(btn);
    });
  }

  function openLightbox(idx){
    currentIndex = idx;
    var item = items[idx];
    lightboxImg.src = 'images/' + item.file;
    lightboxImg.alt = item.caption;
    lightboxCap.textContent = item.caption;
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  function showRelative(delta){
    if(items.length === 0) return;
    currentIndex = (currentIndex + delta + items.length) % items.length;
    openLightbox(currentIndex);
  }

  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox-prev').addEventListener('click', function(){ showRelative(-1); });
  document.getElementById('lightbox-next').addEventListener('click', function(){ showRelative(1); });
  lightbox.addEventListener('click', function(e){
    if(e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', function(e){
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') showRelative(-1);
    if(e.key === 'ArrowRight') showRelative(1);
  });

  items = [
    { file: 'suv.jpg', caption: 'Colored pencil, SUV' },
    { file: 'bus.jpg', caption: 'Colored pencil, city bus' },
    { file: 'beatty-park.jpg', caption: 'Graphite pencil, pool stairs' },
    { file: 'sunset-monument.jpg', caption: 'Colored pencil, sunset monument' },
    { file: 'farmhouse.jpg', caption: 'Colored pencil, farmhouse' },
    { file: 'vb-can.jpg', caption: 'Colored pencil, VB can' },
    { file: 'bananas.jpg', caption: 'Colored pencil, bananas' },
    { file: 'orange-slice.jpg', caption: 'Colored pencil, orange slice' },
    { file: 'apple-slice.jpg', caption: 'Colored pencil, apple slice' },
    { file: 'mangosteen.jpg', caption: 'Colored pencil, mangosteen' },
    { file: 'arms-raised.jpg', caption: 'Colored pencil, arms raised' },
    { file: 'portrait-iron.jpg', caption: 'Graphite pencil, portrait' },
    { file: 'trophy.jpg', caption: 'Colored pencil, trophy' },
    { file: 'portrait-young-woman.jpg', caption: 'Colored pencil, portrait' },
    { file: 'medal.jpg', caption: 'Colored pencil, medal' },
    { file: 'honda-civic.jpg', caption: 'Colored pencil, Honda Civic Type R' },
    { file: 'portrait-grey-tee.jpg', caption: 'Colored pencil, portrait' },
    { file: 'portrait-gold-medal.jpg', caption: 'Colored pencil, medal' },
    { file: 'portrait-crouching.jpg', caption: 'Colored pencil, portrait' },
    { file: 'digital-red-wall.jpg', caption: 'Digital art, red wall' },
    { file: 'digital-wing-view.jpg', caption: 'Digital art, wing view' }
  ];
  renderGallery();
</script>

</body>
</html>
